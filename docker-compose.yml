version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: campus_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-campus_db}
      POSTGRES_USER: ${DB_USER:-campus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campus_user} -d ${DB_NAME:-campus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campus_network

  # ----------------------------------------------------------------------------
  # Django REST Framework Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: campus_django_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py init_demo_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - campus_network

  # ----------------------------------------------------------------------------
  # React + Bootstrap Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: campus_react_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - campus_network

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy / Gateway Service
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: campus_nginx_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - campus_network

volumes:
  postgres_data:
    driver: local

networks:
  campus_network:
    driver: bridge
